spring.application.name=job-tracking
spring.datasource.url=jdbc:postgresql://localhost:5432/job_tracking
spring.datasource.username=db
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
jwt.secret=REPLACE_WITH_YOUR_OWN_SECRET_KEY_AT_LEAST_32_CHARS
jwt.expiration-ms=86400000

app.brevo.api-key=${BREVO_API_KEY}
app.mail.from=${MAIL_FROM}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}