name: Keep demo alive

# Free tiers pause on inactivity: Render sleeps after ~15 min, Supabase pauses a project
# after 7 days without activity. Hitting /api/health (which runs a DB query) every 3 days
# keeps the Supabase project active so the live demo doesn't go down.
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health endpoint
        run: |
          # The first request may take up to a minute while Render wakes the service.
          curl --fail --silent --show-error --retry 5 --retry-delay 20 --retry-all-errors --max-time 120 \
            https://job-tracking-java.onrender.com/api/health
